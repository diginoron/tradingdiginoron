<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Vibrant Royal Blue to Sky Cyan (AI & Digital Neural Synapse) -->
    <linearGradient id="dn-grad-blue" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Global Trade & Capital Momentum Gradient (Emerald to Teal & Sky) -->
    <linearGradient id="dn-grad-trade" x1="60" y1="340" x2="340" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="dn-shield-stroke" x1="200" y1="20" x2="200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="dn-core-glow" cx="200" cy="190" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Elevation Drop Shadow -->
    <filter id="dn-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0369a1" flood-opacity="0.3" />
    </filter>

    <!-- Synapse Pulse Glow -->
    <filter id="dn-node-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Top Section) ==================== -->
  <g transform="translate(0, 10)">
    <!-- Rounded Precision Shield Foundation -->
    <rect
      x="40"
      y="30"
      width="320"
      height="320"
      rx="72"
      fill="#ffffff"
      stroke="url(#dn-shield-stroke)"
      stroke-width="4"
    />

    <!-- Ambient Core Radial Light -->
    <circle cx="200" cy="190" r="130" fill="url(#dn-core-glow)" />

    <!-- Latitudinal Precision Meridian Guides -->
    <circle cx="200" cy="190" r="105" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="8 8" />

    <!-- Continuous Dynamic Trade & Neural Mobius Interlock -->
    <g filter="url(#dn-shadow)">
      <!-- Left Trade Ascent Ribbon -->
      <path
        d="M 104,262 C 84,190 128,110 192,86 C 248,66 296,98 300,150 C 304,198 256,238 200,250 C 152,258 108,238 104,262 Z"
        fill="url(#dn-grad-blue)"
        opacity="0.95"
      />

      <!-- Right Trade Fluid Loop (Global Cross-flow) -->
      <path
        d="M 296,118 C 316,190 272,270 208,294 C 152,314 104,282 100,230 C 96,182 144,142 200,130 C 248,122 292,142 296,118 Z"
        fill="url(#dn-grad-trade)"
        opacity="0.9"
      />

      <!-- Central Precision Diamond Core (Processor Hub) -->
      <path
        d="M 200,142 L 244,190 L 200,238 L 156,190 Z"
        fill="#ffffff"
        stroke="url(#dn-grad-blue)"
        stroke-width="7"
        stroke-linejoin="round"
      />
      <circle cx="200" cy="190" r="14" fill="#38bdf8" />
    </g>

    <!-- Active High-Precision Intelligence Nodes -->
    <g filter="url(#dn-node-glow)">
      <circle cx="280" cy="102" r="15" fill="#38bdf8" stroke="#ffffff" stroke-width="5" />
      <circle cx="120" cy="278" r="13" fill="#10b981" stroke="#ffffff" stroke-width="4.5" />
      <circle cx="136" cy="110" r="11" fill="#60a5fa" />
      <circle cx="264" cy="270" r="11" fill="#34d399" />
    </g>

    <!-- Growth Directional Chevron Vector -->
    <path
      d="M 272,82 L 300,80 L 296,108"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- ==================== TYPOGRAPHY (Bottom Section) ==================== -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" direction="ltr">
    <!-- DigiNoron Title with Trade Badge -->
    <g transform="translate(200, 410)">
      <text x="-32" y="0" font-size="36" font-weight="900" letter-spacing="-0.5" text-anchor="middle" direction="ltr">
        <tspan fill="#0f172a">Digi</tspan><tspan fill="url(#dn-grad-blue)">Noron</tspan>
      </text>

      <!-- Trade Capsule Tag -->
      <rect x="58" y="-22" width="58" height="26" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="87" y="-5" font-size="12" font-weight="800" fill="#1d4ed8" font-family="'JetBrains Mono', monospace" letter-spacing="1" text-anchor="middle">
        TRADE
      </text>
    </g>
    
    <!-- Smart Trade Intelligence Subtitle -->
    <text x="200" y="446" font-size="12" font-weight="700" fill="#64748b" letter-spacing="4" font-family="'JetBrains Mono', monospace" direction="ltr">
      SMART TRADE INTELLIGENCE
    </text>
  </g>
</svg>
